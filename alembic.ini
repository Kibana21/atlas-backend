# Alembic configuration (ATLAS-001 B-10). The database URL is never stored here: it comes from
# ATLAS_MIGRATION_DATABASE_URL (settings; ATLAS_ENV_FILE selects the env file).
[alembic]
script_location = %(here)s/alembic
file_template = %%(rev)s
path_separator = os

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
