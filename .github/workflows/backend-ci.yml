# atlas-backend CI (ATLAS-001 B-28; amendment A5; CP3 `integration`). No shared infrastructure: this
# workflow never connects to the owner's local PostgreSQL or Redis. The `integration` job uses only its
# own isolated, digest-pinned postgres:15 (password authentication, FR-39) and redis:7.4 services.
# Hardening (ci-access.md §5, Mode A): permissions {} with read-only jobs; actions pinned by full
# commit SHA; validation images digest-pinned via the pinned atlas-specs tools; no secrets; the
# privileged PR-target trigger is never used. Every required job runs on pull_request and on main.
name: backend-ci

on:
  pull_request:
  push:
    branches: [main]

permissions: {}

concurrency:
  group: backend-ci-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

env:
  UV_VERSION: "0.10.0"
  UV_PYTHON_DOWNLOADS: never   # ubuntu-24.04 system Python 3.12

jobs:
  static:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true
          cache-dependency-glob: uv.lock
      - run: make lock-check
      - run: uv sync --locked
      - run: make lint format-check typecheck

  unit:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true
          cache-dependency-glob: uv.lock
      - run: make test   # unit + security-marked tests, coverage fail_under 85

  contract:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Read pinned atlas-specs commit
        id: lock
        run: echo "sha=$(awk -F'"' '/^specs_commit:/{print $2}' specs.lock)" >> "$GITHUB_OUTPUT"
      - name: Checkout atlas-specs at the pinned commit (public, read-only)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: Kibana21/atlas-specs
          ref: ${{ steps.lock.outputs.sha }}
          path: .deps/atlas-specs
          fetch-depth: 0       # main reachability and release tags for --release validation
          fetch-tags: true
          persist-credentials: false
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true
          cache-dependency-glob: uv.lock
      - run: make contract SPECS_DIR=.deps/atlas-specs

  security:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true
          cache-dependency-glob: uv.lock
      - run: make security
      - name: Dedicated secret scan of the repository (Trivy, digest-pinned; B-24)
        run: make secret-scan

  integration:
    # CP3 (B-09..B-12) and CP4 (B-13..B-16): database, Redis readiness and the worker round trip.
    runs-on: ubuntu-24.04
    timeout-minutes: 25  # two legs (separated roles, single user); 15 left no headroom after F-09 (13 min)
    permissions:
      contents: read
    services:
      postgres:
        image: postgres:15.19@sha256:baa22e6286bf832cb147b8bb5aa9d8bc999846d69c21d11bf63f58fbeed1fa48
        env:
          # Bootstrap superuser of this ephemeral, job-local container only (not a secret of any
          # shared system). Atlas role passwords are random per run and masked.
          POSTGRES_PASSWORD: ci-ephemeral-bootstrap
          POSTGRES_HOST_AUTH_METHOD: scram-sha-256
          POSTGRES_INITDB_ARGS: --auth-local=scram-sha-256 --auth-host=scram-sha-256 --locale=C --encoding=UTF8
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 2s --health-timeout 5s --health-retries 30
      redis:
        # Job-local Redis (never the owner's shared server): same DB indexes and prefixes as local.
        image: redis:7.4.9@sha256:a8f08480e1f88f2647fed492d1178c06abb0d0c1fbf02c682a61e2f483fb3954
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping" --health-interval 2s --health-timeout 5s --health-retries 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Read pinned atlas-specs commit
        id: lock
        run: echo "sha=$(awk -F'"' '/^specs_commit:/{print $2}' specs.lock)" >> "$GITHUB_OUTPUT"
      - name: Checkout atlas-specs at the pinned commit (public, read-only)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: Kibana21/atlas-specs
          ref: ${{ steps.lock.outputs.sha }}
          path: .deps/atlas-specs
          persist-credentials: false
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true
          cache-dependency-glob: uv.lock
      - run: uv sync --locked
      - name: Bootstrap SQL equals the approved proposal at the pinned specs commit (+ CI-ONLY block)
        run: >-
          uv run python scripts/db/check_bootstrap.py scripts/db/bootstrap.sql
          .deps/atlas-specs/features/ATLAS-001-engineering-foundation/proposals/postgres-local-setup.sql
      - name: Ingestion-role SQL copies equal the approved G3-R scripts at the pinned specs commit (ATLAS-002 DP-3)
        run: |
          set -euo pipefail
          proposals=.deps/atlas-specs/features/ATLAS-002-canonical-graph-foundation/proposals
          for pair in bootstrap-ingest:postgres-ingest-roles bootstrap-ingest-verify:postgres-ingest-roles-verify \
                      bootstrap-ingest-rollback:postgres-ingest-roles-rollback; do
            uv run python scripts/db/check_bootstrap.py "scripts/db/${pair%%:*}.sql" "${proposals}/${pair##*:}.sql" --header-only
          done
      - name: Extract the pinned canonical test data (golden fixture, trust truth table)
        run: |
          set -euo pipefail
          mkdir -p build/specs
          git -C .deps/atlas-specs archive "${{ steps.lock.outputs.sha }}" contracts acceptance/test-data/canonical-golden-v1 \
            acceptance/test-data/trust-function-v1 | tar -x -C build/specs
      - name: Create the four Atlas roles and databases, then the two ingestion roles (random per-run passwords, masked)
        env:
          PGPASSWORD: ci-ephemeral-bootstrap
          CONTAINER: ${{ job.services.postgres.id }}
        run: |
          set -euo pipefail
          for var in ATLAS_MIGRATOR_PASSWORD ATLAS_APP_PASSWORD ATLAS_TEST_MIGRATOR_PASSWORD ATLAS_TEST_APP_PASSWORD \
                     ATLAS_INGEST_PASSWORD ATLAS_TEST_INGEST_PASSWORD; do
            value="$(openssl rand -hex 24)"
            echo "::add-mask::${value}"
            echo "${var}=${value}" >> "$GITHUB_ENV"
            export "${var}=${value}"
          done
          docker exec -i -e PGPASSWORD -e ATLAS_MIGRATOR_PASSWORD -e ATLAS_APP_PASSWORD \
            -e ATLAS_TEST_MIGRATOR_PASSWORD -e ATLAS_TEST_APP_PASSWORD "$CONTAINER" \
            psql -U postgres -d postgres -X -v ON_ERROR_STOP=1 -f - < scripts/db/bootstrap.sql
          docker exec -i -e PGPASSWORD -e ATLAS_INGEST_PASSWORD -e ATLAS_TEST_INGEST_PASSWORD "$CONTAINER" \
            psql -U postgres -d postgres -X -v ON_ERROR_STOP=1 -f - < scripts/db/bootstrap-ingest.sql
          docker exec -i -e PGPASSWORD "$CONTAINER" \
            psql -U postgres -d postgres -X -v ON_ERROR_STOP=1 -f - < scripts/db/bootstrap-ingest-verify.sql
      - name: Migrate atlas_db as atlas_migrator (B-10)
        env:
          ATLAS_ENV: local
          ATLAS_DATABASE_URL: postgresql+psycopg://atlas_app:${{ env.ATLAS_APP_PASSWORD }}@localhost:5432/atlas_db
          ATLAS_MIGRATION_DATABASE_URL: postgresql+psycopg://atlas_migrator:${{ env.ATLAS_MIGRATOR_PASSWORD }}@localhost:5432/atlas_db
          ATLAS_DB_APP_ROLE: atlas_app
          ATLAS_DB_INGEST_ROLE: atlas_ingest
          ATLAS_REDIS_URL: redis://localhost/10
          ATLAS_REDIS_KEY_PREFIX: "atlas:local:"
        run: |
          uv run alembic upgrade head
          uv run alembic current | tee build-alembic-current.txt
          grep -q '^0002_canonical_graph (head)$' build-alembic-current.txt
      - name: Integration tests on atlas_test and Redis DB 11, incl. ci_auth and worker round trip (CP3, CP4)
        env:
          ATLAS_ENV: test
          ATLAS_DATABASE_URL: postgresql+psycopg://atlas_test_app:${{ env.ATLAS_TEST_APP_PASSWORD }}@localhost:5432/atlas_test
          ATLAS_MIGRATION_DATABASE_URL: postgresql+psycopg://atlas_test_migrator:${{ env.ATLAS_TEST_MIGRATOR_PASSWORD }}@localhost:5432/atlas_test
          ATLAS_DB_APP_ROLE: atlas_test_app
          ATLAS_INGEST_DATABASE_URL: postgresql+psycopg://atlas_test_ingest:${{ env.ATLAS_TEST_INGEST_PASSWORD }}@localhost:5432/atlas_test
          ATLAS_DB_INGEST_ROLE: atlas_test_ingest
          ATLAS_REDIS_URL: redis://localhost:6379/11
          ATLAS_REDIS_KEY_PREFIX: "atlas:test:ci:"
          ATLAS_EXPECT_PASSWORD_AUTH: "true"
        run: uv run pytest -m integration --no-cov -ra
      - name: No Atlas test keys remain in the job's Redis (read-only)
        env:
          ATLAS_ENV: test
          ATLAS_ENV_FILE: /nonexistent
          ATLAS_DATABASE_URL: postgresql+psycopg://atlas_test_app:${{ env.ATLAS_TEST_APP_PASSWORD }}@localhost:5432/atlas_test
          ATLAS_MIGRATION_DATABASE_URL: postgresql+psycopg://atlas_test_migrator:${{ env.ATLAS_TEST_MIGRATOR_PASSWORD }}@localhost:5432/atlas_test
          ATLAS_DB_APP_ROLE: atlas_test_app
          ATLAS_REDIS_URL: redis://localhost:6379/11
          ATLAS_REDIS_KEY_PREFIX: "atlas:test:ci:"
        run: |
          uv run python scripts/redis_keys.py --db 11 --pattern 'atlas:test:*' | tee build-redis-keys.txt
          grep -q ": 0 keys match" build-redis-keys.txt
      - name: Rollback drill (G3-R) - downgrade 0002 in both databases, then run the approved rollback script copy
        env:
          PGPASSWORD: ci-ephemeral-bootstrap
          CONTAINER: ${{ job.services.postgres.id }}
          ATLAS_REDIS_URL: redis://localhost:6379/10
          ATLAS_REDIS_KEY_PREFIX: "atlas:local:"
        run: |
          set -euo pipefail
          ATLAS_ENV=test ATLAS_ENV_FILE=/nonexistent ATLAS_DB_APP_ROLE=atlas_test_app ATLAS_DB_INGEST_ROLE=atlas_test_ingest \
            ATLAS_REDIS_URL=redis://localhost:6379/11 ATLAS_REDIS_KEY_PREFIX="atlas:test:ci:" \
            ATLAS_DATABASE_URL="postgresql+psycopg://atlas_test_app:${ATLAS_TEST_APP_PASSWORD}@localhost:5432/atlas_test" \
            ATLAS_MIGRATION_DATABASE_URL="postgresql+psycopg://atlas_test_migrator:${ATLAS_TEST_MIGRATOR_PASSWORD}@localhost:5432/atlas_test" \
            uv run alembic downgrade 0001_baseline
          ATLAS_ENV=local ATLAS_ENV_FILE=/nonexistent ATLAS_DB_APP_ROLE=atlas_app ATLAS_DB_INGEST_ROLE=atlas_ingest \
            ATLAS_DATABASE_URL="postgresql+psycopg://atlas_app:${ATLAS_APP_PASSWORD}@localhost:5432/atlas_db" \
            ATLAS_MIGRATION_DATABASE_URL="postgresql+psycopg://atlas_migrator:${ATLAS_MIGRATOR_PASSWORD}@localhost:5432/atlas_db" \
            uv run alembic downgrade 0001_baseline
          docker exec -i -e PGPASSWORD "$CONTAINER" \
            psql -U postgres -d postgres -X -v ON_ERROR_STOP=1 -f - < scripts/db/bootstrap-ingest-rollback.sql
          docker exec -i -e PGPASSWORD "$CONTAINER" psql -U postgres -d postgres -X -At \
            -c "SELECT string_agg(rolname, ',' ORDER BY rolname) FROM pg_roles WHERE rolname LIKE 'atlas\_%'" | tee build-roles.txt
          grep -qx 'atlas_app,atlas_migrator,atlas_test_app,atlas_test_migrator' build-roles.txt
      - name: Single-user model (owner decision, ATLAS-002) - CI-only superuser atlas_db_user, as on the local server
        env:
          PGPASSWORD: ci-ephemeral-bootstrap
          CONTAINER: ${{ job.services.postgres.id }}
        run: |
          set -euo pipefail
          value="$(openssl rand -hex 24)"
          echo "::add-mask::${value}"
          echo "ATLAS_DB_USER_PASSWORD=${value}" >> "$GITHUB_ENV"
          printf '%s\n' '\set ON_ERROR_STOP on' '\getenv pw ATLAS_DB_USER_PASSWORD' \
            "CREATE ROLE atlas_db_user LOGIN SUPERUSER PASSWORD :'pw';" |
            docker exec -i -e PGPASSWORD -e ATLAS_DB_USER_PASSWORD="${value}" "$CONTAINER" psql -U postgres -d postgres -X -q -f -
      - name: Integration tests on atlas_test in the single-user model (atlas_db is not migrated)
        env:
          ATLAS_ENV: test
          ATLAS_DB_ROLE_MODEL: single
          ATLAS_DATABASE_URL: postgresql+psycopg://atlas_db_user:${{ env.ATLAS_DB_USER_PASSWORD }}@localhost:5432/atlas_test
          ATLAS_MIGRATION_DATABASE_URL: postgresql+psycopg://atlas_db_user:${{ env.ATLAS_DB_USER_PASSWORD }}@localhost:5432/atlas_test
          ATLAS_DB_APP_ROLE: atlas_db_user
          ATLAS_REDIS_URL: redis://localhost:6379/11
          ATLAS_REDIS_KEY_PREFIX: "atlas:test:ci:"
        run: uv run pytest -m integration --no-cov -ra

  benchmark:
    # ATLAS-002 CP4 (A2-T20, A2-T25): publication at increasing graph sizes on this job's own disposable postgres:15
    # (never the shared server). Not a required check: it records measurements; it fails only if publishing fails.
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    permissions:
      contents: read
    services:
      postgres:
        image: postgres:15.19@sha256:baa22e6286bf832cb147b8bb5aa9d8bc999846d69c21d11bf63f58fbeed1fa48
        env:
          POSTGRES_PASSWORD: ci-ephemeral-bootstrap
          POSTGRES_HOST_AUTH_METHOD: scram-sha-256
          POSTGRES_INITDB_ARGS: --auth-local=scram-sha-256 --auth-host=scram-sha-256 --locale=C --encoding=UTF8
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 2s --health-timeout 5s --health-retries 30
      redis:
        # Job-local Redis (settings require one; the benchmark does not use it)
        image: redis:7.4.9@sha256:a8f08480e1f88f2647fed492d1178c06abb0d0c1fbf02c682a61e2f483fb3954
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping" --health-interval 2s --health-timeout 5s --health-retries 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true
          cache-dependency-glob: uv.lock
      - run: uv sync --locked
      - name: Databases and roles (ATLAS-001 bootstrap) plus a CI-only superuser atlas_db_user (single-user model)
        env:
          PGPASSWORD: ci-ephemeral-bootstrap
          CONTAINER: ${{ job.services.postgres.id }}
        run: |
          set -euo pipefail
          for var in ATLAS_MIGRATOR_PASSWORD ATLAS_APP_PASSWORD ATLAS_TEST_MIGRATOR_PASSWORD ATLAS_TEST_APP_PASSWORD \
                     ATLAS_DB_USER_PASSWORD; do
            value="$(openssl rand -hex 24)"
            echo "::add-mask::${value}"
            echo "${var}=${value}" >> "$GITHUB_ENV"
            export "${var}=${value}"
          done
          docker exec -i -e PGPASSWORD -e ATLAS_MIGRATOR_PASSWORD -e ATLAS_APP_PASSWORD \
            -e ATLAS_TEST_MIGRATOR_PASSWORD -e ATLAS_TEST_APP_PASSWORD "$CONTAINER" \
            psql -U postgres -d postgres -X -q -v ON_ERROR_STOP=1 -f - < scripts/db/bootstrap.sql
          printf '%s\n' '\set ON_ERROR_STOP on' '\getenv pw ATLAS_DB_USER_PASSWORD' \
            "CREATE ROLE atlas_db_user LOGIN SUPERUSER PASSWORD :'pw';" |
            docker exec -i -e PGPASSWORD -e ATLAS_DB_USER_PASSWORD "$CONTAINER" psql -U postgres -d postgres -X -q -f -
      - name: Migrate atlas_test and run the publication benchmark (1k, 5k, 10k entities)
        env:
          ATLAS_ENV: test
          ATLAS_ENV_FILE: /nonexistent
          ATLAS_DB_ROLE_MODEL: single
          ATLAS_DATABASE_URL: postgresql+psycopg://atlas_db_user:${{ env.ATLAS_DB_USER_PASSWORD }}@localhost:5432/atlas_test
          ATLAS_MIGRATION_DATABASE_URL: postgresql+psycopg://atlas_db_user:${{ env.ATLAS_DB_USER_PASSWORD }}@localhost:5432/atlas_test
          ATLAS_DB_APP_ROLE: atlas_db_user
          ATLAS_REDIS_URL: redis://localhost:6379/11
          ATLAS_REDIS_KEY_PREFIX: "atlas:test:bench:"
        run: |
          uv run alembic upgrade head
          uv run python scripts/benchmark_canonical.py --sizes 1000,5000,10000 --out build/benchmark-canonical.json

  images:
    # B-21/B-24: build api + worker, hadolint, Trivy (vulnerabilities, secrets, Dockerfile), non-root and
    # content checks, then a hardened runtime check on an isolated Docker network with the job's own
    # postgres/redis containers. Nothing is pushed.
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Build, scan and verify images
        env:
          ATLAS_BUILD_SHA: ${{ github.sha }}
        run: scripts/images_check.sh
