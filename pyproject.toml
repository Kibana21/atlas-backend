[project]
name = "atlas-backend"
version = "0.1.0"
description = "Atlas backend: FastAPI API and Taskiq workers (modular monolith)."
readme = "README.md"
requires-python = "==3.12.*"
# Pinning policy (ATLAS-001 FR-20a, DEC-020): lower bound = verified version; upper bound below the
# next major (next minor for 0.x); exact versions and hashes in uv.lock.
dependencies = [
    "fastapi>=0.143.0,<0.144",
    "pydantic>=2.14.0,<3",
    "pydantic-settings>=2.15.0,<3",
    "uvicorn>=0.54.0,<0.55",
    "structlog>=26.1.0,<27",
    "psycopg>=3.3.6,<4",  # images use Debian's security-maintained libpq5 (no bundled C libraries)
    "redis>=8.1.0,<9",
    "sqlalchemy[asyncio]>=2.1.4,<3",
    "alembic>=1.20.0,<2",
    "taskiq>=0",
    "taskiq-redis>=0",
]

[dependency-groups]
dev = [
    "httpx2>=2.13.1,<3",  # Starlette 1.7 test client (declared in starlette[full])
    "jsonschema>=4.26.0,<5",  # B-20 response contract tests (same validator as atlas-specs tools)
    "psycopg-binary>=3.3.6,<4",  # local/CI convenience only; never in images (bundled libs, E-27)
    "mypy>=2.4.0,<3",
    "pip-audit>=2.10.1,<3",
    "pytest>=9.1.1,<10",
    "pytest-cov>=7.1.0,<8",
    "pyyaml>=6.0.3,<7",
    "ruff>=0.17.0,<0.18",
    "types-jsonschema>=4.26.0.20261006,<5",  # typeshed stubs for strict mypy
    "types-pyyaml>=6.0.12.20260906,<7",  # typeshed stubs for strict mypy
]

[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/atlas"]

[tool.uv]
# Supply-chain lag: resolve only releases published before this date (>= 2 weeks before
# ATLAS-001 CP2). Move forward through reviewed changes only.
exclude-newer = "2026-10-10T00:00:00Z"

[tool.ruff]
line-length = 120
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "UP", "B", "S", "C4", "SIM", "RUF", "PT", "N"]

[tool.ruff.lint.isort]
known-third-party = ["alembic"]  # the repo-root alembic/ scripts directory is not a package

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101"]  # assert is the test idiom

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]
files = ["src", "tests", "scripts", "alembic/versions"]
mypy_path = "src"
explicit_package_bases = true

[tool.pydantic-mypy]
init_forbid_extra = true
init_typed = true
warn_required_dynamic_aliases = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-ra --strict-markers --strict-config -p no:cacheprovider"
markers = [
    "unit: fast tests without external services",
    "integration: tests against real PostgreSQL/Redis (CP3+)",
    "pinned_specs: tests against the pinned atlas-specs contract in build/specs (run by make contract)",
    "ci_auth: CI-only password-authentication tests (ATLAS_EXPECT_PASSWORD_AUTH=true)",
    "role_separation: needs separated database roles (DEC-044); skipped in the local single-user model",
    "contract: contract conformance and schema tests",
    "security: security-focused tests",
]
filterwarnings = ["error"]

[tool.coverage.run]
source = ["atlas"]
branch = true

[tool.coverage.report]
fail_under = 85
show_missing = true
skip_covered = true
exclude_also = ["if TYPE_CHECKING:", "raise NotImplementedError"]
