[project]
name = "atlas-backend"
version = "0.1.0"
description = "Atlas backend: FastAPI API and Taskiq workers (modular monolith)."
readme = "README.md"
requires-python = "==3.12.*"
# Pinning policy (ATLAS-001 FR-20a, DEC-020): lower bound = verified version; upper bound below the
# next major (next minor for 0.x); exact versions and hashes in uv.lock.
dependencies = [
    "fastapi>=0.143.0,<0.144",
    "pydantic>=2.14.0,<3",
    "pydantic-settings>=2.15.0,<3",
    "uvicorn>=0.54.0,<0.55",
    "structlog>=26.1.0,<27",
    "psycopg[binary]>=3.3.6,<4",
    "redis>=8.1.0,<9",
]

[dependency-groups]
dev = [
    "httpx2>=2.13.1,<3",  # Starlette 1.7 test client (declared in starlette[full])
    "mypy>=2.4.0,<3",
    "pip-audit>=2.10.1,<3",
    "pytest>=9.1.1,<10",
    "pytest-cov>=7.1.0,<8",
    "pyyaml>=6.0.3,<7",
    "ruff>=0.17.0,<0.18",
    "types-pyyaml>=6.0.12.20260906,<7",  # typeshed stubs for strict mypy
]

[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/atlas"]

[tool.uv]
# Supply-chain lag: resolve only releases published before this date (>= 2 weeks before
# ATLAS-001 CP2). Move forward through reviewed changes only.
exclude-newer = "2026-10-10T00:00:00Z"

[tool.ruff]
line-length = 120
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "UP", "B", "S", "C4", "SIM", "RUF", "PT", "N"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101"]  # assert is the test idiom

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]
files = ["src", "tests", "scripts"]
mypy_path = "src"
explicit_package_bases = true

[tool.pydantic-mypy]
init_forbid_extra = true
init_typed = true
warn_required_dynamic_aliases = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-ra --strict-markers --strict-config -p no:cacheprovider"
markers = [
    "unit: fast tests without external services",
    "integration: tests against real PostgreSQL/Redis (CP3+)",
    "contract: contract conformance and schema tests",
    "security: security-focused tests",
]
filterwarnings = ["error"]

[tool.coverage.run]
source = ["atlas"]
branch = true

[tool.coverage.report]
fail_under = 85
show_missing = true
skip_covered = true
exclude_also = ["if TYPE_CHECKING:", "raise NotImplementedError"]
